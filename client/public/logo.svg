<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient matches sidebar brand gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A6B7C"/>
      <stop offset="55%" stop-color="#1F7A8C"/>
      <stop offset="100%" stop-color="#2ABDD4"/>
    </linearGradient>

    <!-- Bar fill: top-heavy white for depth -->
    <linearGradient id="bar-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.97)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.50)"/>
    </linearGradient>

    <!-- Glow filter for the top dot -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip everything to the rounded-square boundary -->
    <clipPath id="clip">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft top-left sheen -->
  <ellipse clip-path="url(#clip)" cx="148" cy="112" rx="210" ry="110"
           fill="rgba(255,255,255,0.08)"/>

  <!-- ─── Content (clipped) ─── -->
  <g clip-path="url(#clip)">

    <!-- Baseline bar -->
    <rect x="86" y="428" width="340" height="8" rx="4" fill="rgba(255,255,255,0.28)"/>

    <!-- Bar 1 – short -->
    <rect x="104" y="316" width="76" height="112" rx="14" fill="url(#bar-fill)" opacity="0.62"/>

    <!-- Bar 2 – medium -->
    <rect x="218" y="224" width="76" height="204" rx="14" fill="url(#bar-fill)" opacity="0.78"/>

    <!-- Bar 3 – tall -->
    <rect x="332" y="134" width="76" height="294" rx="14" fill="url(#bar-fill)" opacity="0.94"/>

    <!-- ─── Trend line ─── -->
    <polyline points="142,316 256,224 370,134"
              stroke="white" stroke-width="14" fill="none"
              stroke-linecap="round" stroke-linejoin="round"
              opacity="0.88"/>

    <!-- Dots: bar 1 & 2 -->
    <circle cx="142" cy="316" r="11" fill="white" opacity="0.72"/>
    <circle cx="256" cy="224" r="11" fill="white" opacity="0.85"/>

    <!-- Top dot: highlighted with outer glow ring -->
    <circle cx="370" cy="134" r="26" fill="rgba(255,255,255,0.22)" filter="url(#glow)"/>
    <circle cx="370" cy="134" r="15" fill="white"/>

    <!-- Up arrow above top dot -->
    <path d="M370 97 L354 118 M370 97 L386 118"
          stroke="white" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none" opacity="0.78"/>

  </g>
</svg>
